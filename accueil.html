<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil — Enigma</title>
  <link rel="icon" href="shared/favicon.png">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    .hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .hello h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
    .hello h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--text3); letter-spacing: .02em; margin-top: 6px; text-transform: none; }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; }
    .layout { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
    .layout-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-top: 16px; }
    @media (max-width: 1000px) { .layout, .layout-2 { grid-template-columns: 1fr; } }

    /* ── Planning du jour ─────────────────────────────────── */
    .board-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .board-head input[type=date] { width: auto; padding: 5px 10px; font-size: 12px; }
    .legend { display: flex; gap: 12px; margin-left: auto; font-size: 11px; color: var(--text3); flex-wrap: wrap; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .board { display: grid; gap: 10px; }
    .room-row { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: start; }
    @media (max-width: 720px) { .room-row { grid-template-columns: 1fr; gap: 6px; } }
    .room-lbl { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; padding-top: 6px; }
    .room-lbl i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 10px currentColor; }
    .room-lbl small { display: block; font-weight: 400; font-size: 11px; color: var(--text3); }
    .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
    .slot {
      position: relative; border-radius: 8px; padding: 7px 9px; min-height: 52px;
      border: 1px solid var(--border); background: var(--bg3); font-size: 12px; text-decoration: none; color: var(--text2);
      transition: transform .18s var(--ease), border-color .18s, box-shadow .2s; display: block; overflow: hidden;
    }
    .slot:hover { transform: translateY(-2px); border-color: var(--border2); box-shadow: var(--shadow-sm); }
    .slot .t { font-family: var(--mono); font-weight: 700; font-size: 12px; color: var(--text); }
    .slot .w { display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .slot.free .w { color: var(--text3); }
    .slot.sold { background: rgba(74,222,128,.10); border-color: rgba(74,222,128,.35); }
    .slot.sold .w { color: #bff5cf; }
    .slot.held { background: rgba(200,167,92,.10); border-color: rgba(200,167,92,.45); }
    .slot.held .w { color: var(--brass2); }
    .slot.pending { border-style: dashed; border-color: rgba(245,195,68,.5); }
    .slot.pending .w { color: var(--yellow); }
    .slot.past { opacity: .45; }
    .slot.now { box-shadow: 0 0 0 2px rgba(200,167,92,.6), 0 0 18px rgba(200,167,92,.35); }
    .slot .tag { position: absolute; top: 6px; right: 7px; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .board-empty { padding: 30px; text-align: center; color: var(--text3); font-size: 13px; }

    /* ── Listes ─────────────────────────────────────────── */
    .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .item:last-child { border-bottom: none; }
    .item .when { font-family: var(--mono); font-size: 12px; color: var(--text2); min-width: 92px; }
    .item .when b { display: block; color: var(--text); font-size: 13px; }
    .item .main { flex: 1; min-width: 0; }
    .item .main .sub { color: var(--text3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700; background: var(--bg4); color: var(--text2); flex-shrink: 0; }
    .rank.r1 { background: linear-gradient(135deg, var(--brass2), var(--brass)); color: #1a1300; }
    .rank.r2 { background: #b8bfd0; color: #10141d; } .rank.r3 { background: #b07a4a; color: #fff; }
    .pts { font-family: var(--mono); font-weight: 700; color: var(--brass2); }
    .card-more { font-size: 12px; text-decoration: none; color: var(--text3); }
    .card-more:hover { color: var(--text); }
    .card .card-title a { text-transform: none; letter-spacing: 0; font-weight: 500; }
  </style>
</head>
<body>
<nav class="navbar"><!-- généré par shared/auth.js --></nav>
<div id="toast-container"></div>

<div class="page">
  <div class="hello">
    <h1 id="hello">Bonjour <small id="hello-date"></small></h1>
    <div class="quick">
      <a class="btn btn-primary" href="caisse.html">🎫 Nouveau ticket</a>
      <a class="btn btn-brass" href="joueurs.html">🏆 Fin de partie</a>
      <a class="btn btn-ghost" href="depenses.html">💸 Dépense</a>
    </div>
  </div>

  <div class="stat-grid" id="stats">
    <div class="stat-card skeleton" style="height:84px"></div><div class="stat-card skeleton" style="height:84px"></div>
    <div class="stat-card skeleton" style="height:84px"></div><div class="stat-card skeleton" style="height:84px"></div>
    <div class="stat-card skeleton" style="height:84px"></div>
  </div>

  <div class="layout">
    <!-- Planning du jour -->
    <div class="card">
      <div class="board-head">
        <div class="card-title" style="margin:0;">Planning des salles</div>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="shiftDay(-1)" title="Jour précédent">‹</button>
        <input type="date" id="board-date" onchange="setDay(this.value)">
        <button class="btn btn-ghost btn-sm btn-icon" onclick="shiftDay(1)" title="Jour suivant">›</button>
        <button class="btn btn-ghost btn-sm" onclick="setDay(today())">Aujourd'hui</button>
        <div class="legend">
          <span><i style="background:rgba(74,222,128,.6)"></i>Vendu</span>
          <span><i style="background:rgba(200,167,92,.7)"></i>Réservé (acompte)</span>
          <span><i style="border:1px dashed var(--yellow)"></i>Demande en attente</span>
          <span><i style="background:var(--bg4)"></i>Libre</span>
        </div>
      </div>
      <div class="board" id="board"><div class="board-empty">Chargement…</div></div>
    </div>

    <!-- Demandes en ligne -->
    <div class="card">
      <div class="card-title">Demandes du site <span class="live-dot" style="margin-left:4px">temps réel</span><a class="card-more" href="reservations.html">Tout voir →</a></div>
      <div id="requests"><div class="skeleton" style="height:120px"></div></div>
    </div>
  </div>

  <div class="layout-2">
    <div class="card">
      <div class="card-title">Prochaines parties réservées en ligne <a class="card-more" href="reservations.html">Gérer →</a></div>
      <div id="upcoming"><div class="skeleton" style="height:100px"></div></div>
    </div>
    <div class="card">
      <div class="card-title">Classement du mois <a class="card-more" href="joueurs.html">Classements →</a></div>
      <div id="top"><div class="skeleton" style="height:100px"></div></div>
      <div class="card-title" style="margin-top:18px;">Dernières parties enregistrées</div>
      <div id="sessions"><div class="skeleton" style="height:80px"></div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/config.js"></script>
<script src="shared/auth.js"></script>
<script>
let rooms = [], slotsByRoom = {}, boardDay = null;
const REQ_LABEL = { pending: 'En attente', deposit_received: 'Acompte reçu', confirmed: 'Confirmée', cancelled: 'Annulée', no_show: 'Absent' };
const REQ_BADGE = { pending: 'badge-yellow', deposit_received: 'badge-brass', confirmed: 'badge-green', cancelled: 'badge-red', no_show: 'badge-red' };

function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function longDate(iso) { return new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function shortDate(iso) { return new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short' }); }
function firstName(s) { return String(s || '').trim().split(/\s+/)[0]; }

window.addEventListener('load', async () => {
  try { await requireAuth(); } catch (e) { return; }
  const h = new Date().getHours();
  document.getElementById('hello').firstChild.textContent = (h < 18 ? 'Bonjour ' : 'Bonsoir ') + firstName(currentUser.display_name) + ' ';
  document.getElementById('hello-date').textContent = longDate(today());
  boardDay = today(); document.getElementById('board-date').value = boardDay;

  const [{ data: r }, { data: s }] = await Promise.all([
    sb.from('rooms').select('id,name,color,is_active,duration_minutes').eq('is_active', true).order('sort_order'),
    sb.from('time_slots').select('room_id,start_time,is_active').eq('is_active', true),
  ]);
  rooms = r || [];
  (s || []).forEach(x => (slotsByRoom[x.room_id] = slotsByRoom[x.room_id] || []).push(x.start_time));
  Object.values(slotsByRoom).forEach(a => a.sort());

  await Promise.all([loadStats(), loadBoard(), loadRequests(), loadUpcoming(), loadRanking(), loadSessions()]);

  // Temps réel : une vente ou une demande met le tableau à jour
  sb.channel('accueil')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reservation_requests' }, () => { loadStats(); loadBoard(); loadRequests(); loadUpcoming(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => { loadStats(); loadBoard(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_sessions' }, () => { loadRanking(); loadSessions(); })
    .subscribe();
  setInterval(() => { loadStats(); loadBoard(); }, 120000);
});

// ── Statistiques du jour ─────────────────────────────────────
async function loadStats() {
  const t = today();
  const [tk, pend, pl, exp] = await Promise.all([
    sb.from('tickets').select('num_players,total_price_xof').eq('session_date', t),
    sb.from('reservation_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
    sb.from('players').select('id', { count: 'exact', head: true }),
    sb.from('expenses').select('amount_xof').eq('date', t).neq('status', 'rejected'),
  ]);
  const tickets = tk.data || [];
  const recettes = tickets.reduce((a, x) => a + (x.total_price_xof || 0), 0);
  const joueurs  = tickets.reduce((a, x) => a + (x.num_players || 0), 0);
  const depenses = (exp.data || []).reduce((a, x) => a + (x.amount_xof || 0), 0);
  const cards = [
    ['Parties aujourd\'hui', tickets.length, '', 'billets émis', 'var(--purple)'],
    ['Recettes du jour', recettes, '', 'FCFA' + (depenses ? ` · dépenses : ${depenses.toLocaleString('fr-FR')}` : ''), 'var(--green)'],
    ['Joueurs sur place', joueurs, '', 'personnes attendues', 'var(--cyan)'],
    ['Demandes en attente', pend.count || 0, '', 'réservations du site à traiter', pend.count ? 'var(--yellow)' : 'var(--border2)'],
    ['Joueurs inscrits', pl.count || 0, '', 'comptes sur le site', 'var(--brass)'],
  ];
  document.getElementById('stats').innerHTML = cards.map(([l, v, suf, sub, col], i) => `
    <div class="stat-card ui-rise" style="--stat-color:${col}">
      <div class="stat-label">${l}</div>
      <div class="stat-value" data-count="${v}" data-suffix="${suf}">0</div>
      <div class="stat-sub">${sub}</div>
    </div>`).join('');
  uiCountUp();
}

// ── Planning des salles ──────────────────────────────────────
function setDay(v) { if (!v) return; boardDay = v; document.getElementById('board-date').value = v; loadBoard(); }
function shiftDay(n) { const d = new Date(boardDay + 'T00:00:00'); d.setDate(d.getDate() + n); setDay(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); }

async function loadBoard() {
  const day = boardDay, el = document.getElementById('board');
  const [{ data: tk }, { data: rq }] = await Promise.all([
    sb.from('tickets').select('room_id,time_slot,num_players,client_name,ticket_number,ticket_type').eq('session_date', day),
    sb.from('reservation_requests').select('id,room_id,time_slot,num_players,client_name,status').eq('session_date', day).in('status', ['pending','deposit_received','confirmed']),
  ]);
  if (day !== boardDay) return; // l'utilisateur a changé de jour entre-temps
  const sold = {}, held = {}, pend = {};
  (tk || []).forEach(x => sold[x.room_id + '|' + x.time_slot] = x);
  (rq || []).forEach(x => (x.status === 'pending' ? pend : held)[x.room_id + '|' + x.time_slot] = x);

  const now = new Date(), isToday = day === today();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };

  if (!rooms.length) { el.innerHTML = '<div class="board-empty">Aucune salle active. Ajoutez-en dans Admin → Salles.</div>'; return; }
  el.innerHTML = rooms.map(r => {
    const slots = slotsByRoom[r.id] || [];
    const cells = slots.length ? slots.map(t => {
      const k = r.id + '|' + t; let cls = 'free', w = 'libre', tag = '', href = 'caisse.html', title = 'Vendre ce créneau à la caisse';
      if (sold[k]) { cls = 'sold'; w = `${escHtml(sold[k].client_name || 'Client')} · ${sold[k].num_players || '?'}j`; tag = 'vendu'; title = 'Billet ' + (sold[k].ticket_number || ''); href = 'caisse.html'; }
      else if (held[k]) { cls = 'held'; w = `${escHtml(held[k].client_name)} · ${held[k].num_players}j`; tag = held[k].status === 'confirmed' ? 'confirmé' : 'acompte'; href = 'reservations.html'; title = 'Réservation en ligne — ' + REQ_LABEL[held[k].status]; }
      else if (pend[k]) { cls = 'pending'; w = `${escHtml(pend[k].client_name)} · ${pend[k].num_players}j`; tag = 'demande'; href = 'reservations.html'; title = 'Demande en attente — à traiter'; }
      const past = day < today() || (isToday && toMin(t) + (r.duration_minutes || 60) < nowMin);
      const cur  = isToday && nowMin >= toMin(t) && nowMin < toMin(t) + (r.duration_minutes || 60);
      return `<a class="slot ${cls}${past ? ' past' : ''}${cur ? ' now' : ''}" href="${href}" title="${title}"><span class="t">${t}</span>${tag ? `<span class="tag">${tag}</span>` : ''}<span class="w">${w}</span></a>`;
    }).join('') : '<div class="text-muted" style="font-size:12px;padding:8px 0;">Aucun créneau configuré (Admin → Créneaux)</div>';
    const n = slots.filter(t => sold[r.id + '|' + t] || held[r.id + '|' + t]).length;
    return `<div class="room-row ui-rise">
      <div class="room-lbl" style="color:${r.color || '#857af5'}"><i style="background:currentColor"></i><div style="color:var(--text)">${escHtml(r.name)}<small>${n}/${slots.length} créneaux pris</small></div></div>
      <div class="slots">${cells}</div>
    </div>`;
  }).join('');
}

// ── Demandes récentes ────────────────────────────────────────
async function loadRequests() {
  const { data } = await sb.from('reservation_requests').select('id,client_name,client_phone,num_players,session_date,time_slot,status,room_id,created_at').order('created_at', { ascending: false }).limit(6);
  const el = document.getElementById('requests');
  if (!data || !data.length) { el.innerHTML = '<div class="empty-state"><div class="big">🌐</div>Aucune demande reçue depuis le site pour l\'instant.</div>'; return; }
  const rn = id => (rooms.find(r => r.id === id) || {}).name || '?';
  el.innerHTML = data.map(x => `
    <a class="item ui-rise" href="reservations.html" style="text-decoration:none;color:inherit;">
      <div class="when">${shortDate(x.session_date)}<b>${x.time_slot}</b></div>
      <div class="main"><div>${escHtml(x.client_name)} <span class="text-muted">· ${x.num_players}j</span></div><div class="sub">${escHtml(rn(x.room_id))} · ${escHtml(x.client_phone || '')} · reçu ${new Date(x.created_at).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</div></div>
      <span class="badge ${REQ_BADGE[x.status] || 'badge-muted'}">${REQ_LABEL[x.status] || x.status}</span>
    </a>`).join('');
}

// ── Prochaines parties réservées (7 jours) ───────────────────
async function loadUpcoming() {
  const t = today(), d = new Date(); d.setDate(d.getDate() + 7);
  const end = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const { data } = await sb.from('reservation_requests').select('id,client_name,num_players,session_date,time_slot,status,room_id,extreme_mode')
    .in('status', ['deposit_received', 'confirmed']).gte('session_date', t).lte('session_date', end).order('session_date').order('time_slot').limit(20);
  const el = document.getElementById('upcoming');
  if (!data || !data.length) { el.innerHTML = '<div class="empty-state"><div class="big">📅</div>Aucune partie réservée en ligne dans les 7 prochains jours.</div>'; return; }
  const rn = id => rooms.find(r => r.id === id) || {};
  el.innerHTML = data.map(x => { const r = rn(x.room_id); return `
    <div class="item ui-rise">
      <div class="when">${shortDate(x.session_date)}<b>${x.time_slot}</b></div>
      <div class="main"><div><span style="color:${r.color || '#857af5'}">●</span> ${escHtml(r.name || '?')} — ${escHtml(x.client_name)}</div><div class="sub">${x.num_players} joueurs${x.extreme_mode ? ' · mode extrême' : ''}</div></div>
      <span class="badge ${REQ_BADGE[x.status]}">${REQ_LABEL[x.status]}</span>
    </div>`; }).join('');
}

// ── Classement du mois & dernières parties ───────────────────
async function loadRanking() {
  const { data } = await sb.from('leaderboard_players_month').select('*').limit(5);
  const el = document.getElementById('top');
  if (!data || !data.length) { el.innerHTML = '<div class="empty-state" style="padding:18px 0;">Pas encore de points ce mois-ci. Enregistrez une fin de partie dans <b>Joueurs</b>.</div>'; return; }
  const max = data[0].points || 1;
  el.innerHTML = data.map((p, i) => `
    <div class="item ui-rise">
      <span class="rank r${i+1}">${i+1}</span>
      <div class="main"><div>${escHtml(p.display_name)} ${p.team_name ? `<span class="text-muted">· ${escHtml(p.team_name)}</span>` : ''}</div>
        <div class="bar" style="height:3px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden;"><i style="display:block;height:100%;width:${Math.round(p.points / max * 100)}%;background:linear-gradient(90deg,var(--brass),var(--brass2));"></i></div></div>
      <span class="pts">${(p.points || 0).toLocaleString('fr-FR')} pts</span>
    </div>`).join('');
}
async function loadSessions() {
  const { data } = await sb.from('game_sessions').select('id,team_name,session_date,time_slot,finished,extreme_mode,created_at,rooms(name,color),key_finds(id)').order('created_at', { ascending: false }).limit(5);
  const el = document.getElementById('sessions');
  if (!data || !data.length) { el.innerHTML = '<div class="empty-state" style="padding:14px 0;">Aucune partie enregistrée.</div>'; return; }
  el.innerHTML = data.map(x => `
    <div class="item ui-rise">
      <div class="when">${shortDate(x.session_date)}<b>${x.time_slot || ''}</b></div>
      <div class="main"><div><span style="color:${x.rooms?.color || '#857af5'}">●</span> ${escHtml(x.rooms?.name || '?')} — ${escHtml(x.team_name || 'équipe')}</div>
        <div class="sub">${(x.key_finds || []).length} clé(s) trouvée(s)${x.extreme_mode ? ' · extrême' : ''}</div></div>
      <span class="badge ${x.finished ? 'badge-green' : 'badge-red'}">${x.finished ? 'Sortis' : 'Échec'}</span>
    </div>`).join('');
}
</script>
</body>
</html>
