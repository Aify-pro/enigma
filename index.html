<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enigma Escape Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e0e14; display: flex; align-items: center;
      justify-content: center; min-height: 100vh;
      font-family: system-ui, sans-serif; color: #fff;
    }
    .loader {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(124,106,247,.2);
      border-top-color: #7c6af7; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label { font-size: 13px; color: #6b6b8a; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div class="label">Enigma Escape Game</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="shared/config.js"></script>
  <script>
    (async () => {
      const sb = supabase.createClient(
        ENIGMA_CONFIG.supabaseUrl,
        ENIGMA_CONFIG.supabaseAnonKey,
        { auth: { persistSession: true, storageKey: 'enigma_auth' } }
      );
      const { data: { session } } = await sb.auth.getSession();
      window.location.replace(session ? 'caisse.html' : 'login.html');
    })();
  </script>
</body>
</html>
