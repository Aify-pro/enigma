<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enigma Escape Game</title>
  <link rel="icon" href="shared/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0d14; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; color: #fff; }
    .loader { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .loader img { width: 200px; opacity: .9; }
    .spinner { width: 34px; height: 34px; border: 3px solid rgba(200,167,92,.2); border-top-color: #c8a75c; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label { font-size: 12px; color: #667089; letter-spacing: .15em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="loader">
    <img src="shared/logo.png" alt="Enigma">
    <div class="spinner"></div>
    <div class="label">Ouverture…</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="shared/config.js"></script>
  <script>
    (async () => {
      const sb = supabase.createClient(ENIGMA_CONFIG.supabaseUrl, ENIGMA_CONFIG.supabaseAnonKey, { auth: { persistSession: true, storageKey: 'enigma_auth' } });
      const { data: { session } } = await sb.auth.getSession();
      window.location.replace(session ? 'accueil.html' : 'login.html');
    })();
  </script>
</body>
</html>
