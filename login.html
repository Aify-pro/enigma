<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Enigma</title>
  <link rel="icon" href="shared/favicon.png">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    body::before {
      background:
        radial-gradient(700px 420px at 50% 120%, rgba(200,167,92,.14), transparent 60%),
        radial-gradient(800px 500px at 20% -10%, rgba(133,122,245,.14), transparent 60%);
    }
    /* grille de fond très légère */
    .grid { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .35;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 48px 48px; mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 70%); }
    .login-wrap { width: 100%; max-width: 380px; padding: 20px; animation: ui-rise .6s var(--ease) both; }
    .login-logo { display: block; width: 240px; max-width: 80%; margin: 0 auto 6px; filter: drop-shadow(0 8px 24px rgba(0,0,0,.6)); }
    .login-sub { text-align: center; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--brass); margin-bottom: 26px; }
    .login-card { background: rgba(16,20,29,.9); border: 1px solid var(--border2); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); backdrop-filter: blur(10px); position: relative; }
    .login-card::before { content: ""; position: absolute; left: 24px; right: 24px; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--brass), transparent); opacity: .7; }
    .lock { display: flex; justify-content: center; margin-bottom: 18px; }
    .lock svg { width: 46px; height: 46px; }
    .lock .shackle { transform-origin: 32px 26px; transition: transform .5s var(--ease); }
    .lock.open .shackle { transform: translateY(-6px) rotate(-14deg); }
    .lock.shake { animation: shake .4s ease; }
    @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-5px);} 75% { transform: translateX(5px);} }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .pw-eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; font-size: 15px; padding: 4px 6px; border-radius: 6px; }
    .pw-eye:hover { color: var(--text); background: var(--bg3); }
    #l-err { color: var(--red); font-size: 12px; margin-bottom: 12px; min-height: 16px; }
    .foot { text-align: center; font-size: 11px; color: var(--text3); margin-top: 20px; }
    .foot a { color: var(--text3); }
  </style>
</head>
<body>
<div class="grid"></div>
<div class="login-wrap">
  <img class="login-logo" src="shared/logo.png" alt="Enigma Escape Games">
  <div class="login-sub">Espace staff</div>

  <div class="login-card">
    <div class="lock" id="lock" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path class="shackle" d="M20 30V22a12 12 0 0 1 24 0v8" stroke="#c8a75c" stroke-width="4" stroke-linecap="round"/>
        <rect x="14" y="30" width="36" height="26" rx="6" fill="#171c28" stroke="#c8a75c" stroke-width="3"/>
        <circle cx="32" cy="42" r="3.5" fill="#e3c78a"/><path d="M32 45v5" stroke="#e3c78a" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <form id="login-form" onsubmit="doLogin(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="l-email" required autocomplete="email" placeholder="staff@enigma.com" autofocus />
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <div class="pw-wrap">
          <input type="password" id="l-pass" required autocomplete="current-password" placeholder="••••••••" />
          <button type="button" class="pw-eye" onclick="togglePw()" title="Afficher / masquer" aria-label="Afficher le mot de passe">👁</button>
        </div>
      </div>
      <div id="l-err" role="alert"></div>
      <button type="submit" id="l-btn" class="btn btn-primary btn-full btn-lg">Se connecter</button>
    </form>
  </div>
  <div class="foot">Enigma Escape Games · Bietry, Abidjan · <span id="year"></span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/config.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
const sb = supabase.createClient(
  ENIGMA_CONFIG.supabaseUrl,
  ENIGMA_CONFIG.supabaseAnonKey,
  { auth: { persistSession: true, storageKey: 'enigma_auth' } }
);
const HOME = 'accueil.html';

// Message si redirigé depuis une page (rôle non autorisé, session expirée…)
const q = new URLSearchParams(location.search);
if (q.get('e') === 'role') document.getElementById('l-err').textContent = "Ce compte n'a pas accès à l'espace staff.";

// Si déjà connecté (et staff/admin), aller directement à l'accueil
window.addEventListener('load', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && ['admin','staff'].includes((session.user.app_metadata?.role || 'user').toLowerCase())) window.location.replace(HOME);
});

function togglePw() {
  const i = document.getElementById('l-pass'); i.type = i.type === 'password' ? 'text' : 'password'; i.focus();
}

async function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const btn   = document.getElementById('l-btn');
  const err   = document.getElementById('l-err');
  const lock  = document.getElementById('lock');

  btn.disabled = true; btn.textContent = 'Connexion…'; err.textContent = ''; lock.classList.remove('shake');

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });

  if (error) {
    err.textContent = error.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect' : error.message;
    btn.disabled = false; btn.textContent = 'Se connecter';
    lock.classList.add('shake'); document.getElementById('l-pass').select();
    return;
  }
  const role = (data.session?.user?.app_metadata?.role || 'user').toLowerCase();
  if (!['admin','staff'].includes(role)) {
    await sb.auth.signOut();
    err.textContent = "Ce compte n'a pas accès à l'espace staff.";
    btn.disabled = false; btn.textContent = 'Se connecter';
    return;
  }
  lock.classList.add('open'); btn.textContent = 'Bienvenue !';
  setTimeout(() => { window.location.href = HOME; }, 450);
}
</script>
</body>
</html>
